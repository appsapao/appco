name: Build debug APK and run tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK + unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Provides Gradle dependency/build caching. The Gradle version itself comes
      # from gradle/wrapper/gradle-wrapper.properties, which is pinned by both
      # version and SHA-256 so the build uses exactly the same distribution
      # locally and in CI.
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace test

      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # Non-blocking: the artifact is still published if a future toolchain change
      # introduces nondeterminism, but the result is visible in the job summary.
      - name: Verify the build is reproducible
        continue-on-error: true
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "${APK}" /tmp/first-build.apk
          FIRST="$(sha256sum /tmp/first-build.apk | cut -d' ' -f1)"
          ./gradlew --no-daemon -q clean assembleDebug
          SECOND="$(sha256sum "${APK}" | cut -d' ' -f1)"
          echo "first:  ${FIRST}"
          echo "second: ${SECOND}"
          if [ "${FIRST}" = "${SECOND}" ]; then
            echo "Reproducible: two clean builds produced identical APKs." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Clean builds produced different APKs (${FIRST} vs ${SECOND})"
            echo "Not reproducible: clean builds differ." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Inspect the built APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          BUILD_TOOLS="$(ls -d "${SDK_ROOT}"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: ${BUILD_TOOLS}"
          "${BUILD_TOOLS}/apksigner" verify --print-certs "${APK}"
          # `sed` instead of `head`: with `pipefail`, an early-closing `head`
          # turns the tool's SIGPIPE into a failed step.
          "${BUILD_TOOLS}/aapt2" dump badging "${APK}" | sed -n '1,5p'
          {
            echo "### Built APK"
            echo '```'
            sha256sum "${APK}"
            ls -l "${APK}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-cloner-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 14
